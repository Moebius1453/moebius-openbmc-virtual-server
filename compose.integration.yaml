name: moebius-openbmc-integration
services:
  server:
    image: moebius-openbmc-virtual-server:integration-rpm
    user: "1000:1000"
    group_add:
      - "${KVM_GID:?Set KVM_GID to the host kvm device group}"
    devices:
      - /dev/kvm:/dev/kvm
    cpus: 4
    mem_limit: 6g
    pids_limit: 256
    restart: "no"
    stop_grace_period: 90s
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports:
      - "127.0.0.1:2260:2222"
      - "127.0.0.1:2460:2443"
      - "127.0.0.1:2261:2223"
    volumes:
      - ./state:/lab/state
    tmpfs:
      - /run/lab:size=16m,mode=0700,uid=1000,gid=1000
    command: ["python3", "-u", "/lab/lab_manager.py"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
